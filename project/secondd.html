<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>For You ❤️</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(to top, #ffe6f0, #ffc0cb);
      font-family: 'Segoe UI', cursive, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }

    .shayari-box {
      background: white;
      padding: 40px;
      border-radius: 20px;
      max-width: 600px;
      box-shadow: 0 0 20px rgba(255, 105, 180, 0.4);
      animation: fadeIn 2s ease-in-out;
    }

    h1 {
      color: #d6336c;
      font-size: 2em;
    }

    p {
      font-size: 1.5em;
      color: #444;
      line-height: 1.6;
    }

    @keyframes fadeIn {
      0% { opacity: 0; transform: scale(0.9); }
      100% { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

  <div class="shayari-box">
    <h1>🌹 Mere Dil Ki Shayari 🌹</h1>
    <p>
      Tere bina adhuri hai zindagi meri,<br>
      Tu ho toh har pal hai suhani meri 💖<br><br>
      Khwabon mein tu, yaadon mein tu,<br>
      Har jagah hai bas baatein teri ✨<br><br>
      Kya tu banegi zindagi bhar ke liye<br>
      Sirf meri...? 💍❤️
    </p>
  </div>

</body>
</html>
